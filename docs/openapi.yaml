openapi: 3.0.3
info:
  title: Marivect development API
  version: 0.2.0
servers:
- url: /
paths:
  /health/live:
    get:
      responses:
        '200':
          description: Process alive; plain text ok
  /health/ready:
    get:
      responses:
        '200':
          description: DB and foundation table accessible
        '503':
          description: Dependency unavailable
  /api/v1/ingest/push:
    post:
      security:
      - sourceToken: []
      description: Synchronous atomic processing. Source/tenant bound to credential.
        64 KiB body limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushEvent'
      responses:
        '200':
          description: Committed event or identical duplicate
          content:
            application/json:
              schema:
                type: object
                required:
                - event_id
                - status
                - duplicate
                properties:
                  event_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                    - processed
                  duplicate:
                    type: boolean
        '400':
          description: Invalid JSON
        '401':
          description: Missing or invalid source credential
        '409':
          description: Message ID reused with a different payload
        '413':
          description: Body too large
        '415':
          description: Content type must be application/json
        '422':
          description: Invalid schema
          time: null
          key: null
          unit or value: null
        '500':
          description: Internal error; retry with same message ID and payload
  /api/v1/source/latest:
    get:
      security:
      - sourceToken: []
      description: Latest numeric values for the one source bound to the credential;
        maximum 128.
      responses:
        '200':
          description: Latest values, possibly empty
          content:
            application/json:
              schema:
                type: object
                required:
                - tenant_id
                - device_id
                - measurements
                properties:
                  tenant_id:
                    type: string
                    format: uuid
                  device_id:
                    type: string
                    format: uuid
                  measurements:
                    type: array
                    items:
                      type: object
                      required:
                      - key
                      - unit
                      - value
                      - observed_at
                      - received_at
                      - quality
                      properties:
                        key:
                          type: string
                        unit:
                          type: string
                        value:
                          type: number
                          format: double
                        observed_at:
                          type: string
                          format: date-time
                        received_at:
                          type: string
                          format: date-time
                        quality:
                          type: string
                          enum:
                          - unknown
        '401':
          description: Missing or invalid source credential
        '500':
          description: Internal error
  /api/v1/auth/login:
    post:
      description: Requires Origin matching APP_ORIGIN; login rate limited at Nginx.
        Rotates the existing browser session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
      responses:
        '200':
          description: Sets HttpOnly/SameSite=Strict session cookie, returns csrf_token
        '401':
          description: Invalid credentials
        '403':
          description: Origin mismatch
        '422':
          description: Invalid JSON structure
        '429':
          description: Login limit exceeded
  /api/v1/auth/me:
    get:
      security:
      - userSession: []
      responses:
        '200':
          description: user {user_id,email,csrf_token} and memberships [{tenant_id,name,role}];
            Cache-Control no-store
        '401': &id001
          description: Session missing, revoked or expired
  /api/v1/auth/logout:
    post:
      security:
      - userSession: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Session revoked in DB and cookie cleared
        '401': *id001
        '403': &id002
          description: Origin/CSRF/membership/role denied
  /api/v1/tenants/{tenant}/devices:
    parameters:
    - &id004
      name: tenant
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      security:
      - userSession: []
      description: Any current member. Maximum 200 devices; response devices and limit.
      responses:
        '200':
          description: devices [{id,name,capabilities}], limit:200
        '401': *id001
        '403': *id002
        '500': &id003
          description: Internal error
    post:
      security:
      - userSession: []
      description: tenant_admin only. Requires Origin and X-CSRF-Token. Returns a
        one-time source token.
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              - sensors
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                sensors:
                  type: array
                  minItems: 1
                  maxItems: 128
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - key
                    - unit
                    properties:
                      key:
                        type: string
                        pattern: ^[a-zA-Z0-9_]{1,64}$
                      unit:
                        type: string
                        maxLength: 32
      responses:
        '201':
          description: device_id UUID and source_token; token is never retrievable
            again
        '422':
          description: Invalid device/sensor data
        '401': *id001
        '403': *id002
        '500': *id003
  /api/v1/tenants/{tenant}/devices/{device}/latest:
    parameters:
    - *id004
    - name: device
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      security:
      - userSession: []
      description: Any current member. Sensors with no received reading return null
        value and timestamps.
      responses:
        '200':
          description: device_id and measurements [{key,unit,value,observed_at,received_at,quality}]
        '404':
          description: Device does not exist in this tenant
        '401': *id001
        '403': *id002
        '500': *id003
components:
  securitySchemes:
    sourceToken:
      type: http
      scheme: bearer
    userSession:
      type: apiKey
      in: cookie
      name: marivect_session
      description: HttpOnly cookie issued by login; 12h absolute expiry
  schemas:
    PushEvent:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - message_id
      - observed_at
      - measurements
      properties:
        schema_version:
          type: integer
          enum:
          - 1
        message_id:
          type: string
          minLength: 1
          maxLength: 128
        observed_at:
          type: string
          format: date-time
          description: At most 5 minutes in future and 366 days in past
        measurements:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required:
            - key
            - value
            - unit
            properties:
              key:
                type: string
                minLength: 1
                maxLength: 64
              value:
                type: number
                format: double
              unit:
                type: string
                maxLength: 32
