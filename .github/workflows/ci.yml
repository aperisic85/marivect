name: verify
on: [push, pull_request]
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Create local test credentials
        run: python3 scripts/init-env.py
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start
        run: docker compose up --build --wait db api worker frontend
      - name: Seed two sources
        run: docker compose --profile tools run --rm seed
      - name: Rust checks
        run: docker compose --profile tools run --build --rm checks
      - name: Integration checks
        run: python3 tests/smoke.py
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down -v
